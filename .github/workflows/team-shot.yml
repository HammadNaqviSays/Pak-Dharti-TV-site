name: team-shot
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm i playwright >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          node -e "
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:900,height:1200}});
          await p.goto('https://www.pakdhartitv.com/ur/team',{waitUntil:'networkidle'});await p.waitForTimeout(1500);await p.screenshot({path:'/tmp/team.png',fullPage:true});await b.close()})()"
          git config user.name shots; git config user.email shots@example.com
          git checkout --orphan shots; git rm -rf . -q; cp /tmp/team.png team.png; git add team.png; git commit -qm shot; git push -f origin shots
