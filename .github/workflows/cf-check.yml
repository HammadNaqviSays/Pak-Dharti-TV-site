name: cf-check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare account check (no secrets printed)
        run: |
          api() { curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4$1"; }
          echo "== token"; api /user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('result',{}).get('status'),[e.get('message') for e in d.get('errors',[])])"
          echo "== subscriptions"; api /accounts/$A/subscriptions | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),[(s.get('rate_plan',{}).get('public_name'),s.get('price'),s.get('currency'),s.get('frequency')) for s in d.get('result',[])] if d.get('success') else d.get('errors'))"
          echo "== r2 buckets"; api /accounts/$A/r2/buckets | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),[b.get('name') for b in d.get('result',{}).get('buckets',[])] if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          echo "== kv"; api /accounts/$A/storage/kv/namespaces | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),[n.get('title') for n in d.get('result',[])] if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
