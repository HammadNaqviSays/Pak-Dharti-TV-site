name: video-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pages
        run: |
          date -u
          for p in / /ur /ur/help /en /admin /admin/info /api/health; do printf "%s " "$p"; curl -sS -o b.html -w "HTTP %{http_code}\n" --max-time 25 "https://www.pakdhartitv.com$p" || true; grep -o "server-side exception[^<]*" b.html | head -1; done
