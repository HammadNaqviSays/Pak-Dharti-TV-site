name: video-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Is the domain alive
        run: |
          date -u
          for h in www.pakdhartitv.com pakdhartitv.com; do echo "== $h"; curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 20 "https://$h/ur/help" || true; done
          echo "NS:"; dig +short NS pakdhartitv.com || true
          echo "A:"; dig +short A www.pakdhartitv.com || true
          echo "WHOIS-ish:"; whois pakdhartitv.com 2>/dev/null | grep -iE "name server|status|expir|registrar:" | head -12 || true
