name: video-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public pages
        run: |
          for u in ur en; do
            code=$(curl -sS -o p.html -w "%{http_code}" "https://www.pakdhartitv.com/$u/help"); echo "PAGE $u HTTP $code"
            for k in 1799 1043 1099 1777 "tel:"; do echo "  $k x$(grep -o -- "$k" p.html | wc -l)"; done
          done
