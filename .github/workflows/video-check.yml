name: video-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Live server log for 4 minutes (errors only)
        run: |
          echo "TAIL START $(date -u +%T)"
          timeout 240 npx --yes wrangler@4 tail pak-dharti-tv --format json --status error 2>&1 | python3 -c "
          import sys, json
          for line in sys.stdin:
              line=line.strip()
              if not line: continue
              try:
                  d=json.loads(line)
              except Exception:
                  print('RAW', line[:300]); continue
              url=(d.get('event') or {}).get('request',{}).get('url','')
              ex=[(e.get('name'),e.get('message')) for e in d.get('exceptions',[])]
              logs=[' '.join(str(m)[:300] for m in l.get('message',[])) for l in d.get('logs',[]) if l.get('level')=='error'][:4]
              print('ERR', url, ex[:2], logs)
          " || true
          echo "TAIL END"
