# Read-only diagnosis: records the live worker's logs while a short burst of page opens runs, then prints the errors.
name: seo-tail
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tail while bursting
        run: |
          npx --yes wrangler@4 tail pak-dharti-tv --format json > tail.log 2> tail.err &
          TP=$!
          sleep 12
          node scripts/seo-burst.mjs | sed 's/^/BURST /' | cut -c1-200
          sleep 6
          kill $TP 2>/dev/null || true
          echo "TAIL stderr: $(head -c 600 tail.err | tr '\n' ' ')"
          echo "TAIL lines: $(wc -l < tail.log)"
          node -e '
            const fs=require("fs");const raw=fs.readFileSync("tail.log","utf8");const L=[];{let d=0,st=-1,ins=false,esc=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(ins){if(esc)esc=false;else if(c==="\\")esc=true;else if(c==='"')ins=false;continue}if(c==='"')ins=true;else if(c==="{"){if(d===0)st=i;d++}else if(c==="}"){d--;if(d===0&&st>=0)L.push(raw.slice(st,i+1))}}}
            const out={},keys={},err={};let shown=0;
            for(const l of L){let j;try{j=JSON.parse(l)}catch{continue}
              out[j.outcome]=(out[j.outcome]||0)+1;
              for(const k of Object.keys(j))keys[k]=1;
              const bad=j.outcome&&j.outcome!=="ok"&&j.outcome!=="canceled";
              const ex=(j.exceptions||[]).map(e=>e.name+": "+e.message);
              if(bad||ex.length){const key=(ex[0]||j.outcome).slice(0,260);err[key]=(err[key]||0)+1;
                if(shown<4){shown++;console.log("TAIL SAMPLE",l.slice(0,900))}}
              for(const m of j.logs||[]){const t=(m.message||[]).map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" ");
                if(/error|fail|limit|exceed|429|timeout|ECONN|pool|Mongo/i.test(t)){const key="LOG "+t.slice(0,260);err[key]=(err[key]||0)+1}}
            }
            console.log("TAIL outcomes",JSON.stringify(out),"keys",Object.keys(keys).join(","));
            for(const [k,v] of Object.entries(err).sort((a,b)=>b[1]-a[1]).slice(0,12))console.log("TAIL",v,"x",k)
          '
