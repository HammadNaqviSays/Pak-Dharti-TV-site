# Read-only diagnosis: records the live worker's logs while a short burst of page opens runs, then prints the errors.
name: seo-tail
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: tail while bursting
        run: |
          npx --yes wrangler@4 tail pak-dharti-tv --format json > tail.log 2> tail.err &
          TP=$!
          sleep 12
          node scripts/seo-burst.mjs | sed 's/^/BURST /' | cut -c1-200
          sleep 6
          kill $TP 2>/dev/null || true
          echo "TAIL stderr: $(head -c 600 tail.err | tr '\n' ' ')"
          echo "TAIL lines: $(wc -l < tail.log)"
          node -e '
            const fs=require("fs");const L=fs.readFileSync("tail.log","utf8").split("\n").filter(Boolean);
            const seen={};let n500=0;
            for(const l of L){let j;try{j=JSON.parse(l)}catch{continue}
              const st=j.event?.response?.status;if(st>=500)n500++;
              for(const e of j.exceptions||[]){const k=(e.name+": "+e.message).slice(0,300);seen[k]=(seen[k]||0)+1}
              for(const m of j.logs||[]){const t=(m.message||[]).join(" ").slice(0,300);if(/error|fail|limit|exceed|429|timeout/i.test(t)){seen["LOG "+t]=(seen["LOG "+t]||0)+1}}
              if(j.outcome&&j.outcome!=="ok"&&!j.exceptions?.length){const k="OUTCOME "+j.outcome;seen[k]=(seen[k]||0)+1}
            }
            console.log("TAIL requests with 5xx:",n500);
            for(const [k,v] of Object.entries(seen).sort((a,b)=>b[1]-a[1]).slice(0,12))console.log("TAIL",v,"x",k)
          '
