# Checks that the keys in SOCIAL_EXTRA_ENV (Bluesky / Telegram / Threads) can log in. Posts nothing. Run by hand.
name: extra-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/extra-check.mjs
        env:
          SOCIAL_EXTRA_ENV: ${{ secrets.SOCIAL_EXTRA_ENV }}
