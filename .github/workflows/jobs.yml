# Collects job ads from official sources (once a day) and sends them to the site to be read and checked.
name: jobs
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
    inputs: { only: { description: "comma list of source keys (empty = all)", required: false, default: "" } }
concurrency: { group: jobs, cancel-in-progress: false }
permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tools for PDFs (text and scanned pages)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr
      - name: Collect
        env:
          SITE: https://www.pakdhartitv.com
          TOKEN: ${{ secrets.CRON_TOKEN }}
          ONLY: ${{ inputs.only }}
        run: node scripts/jobs-collect.mjs
