name: cf-audit
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read-only Cloudflare audit (names only, no secret values)
        run: |
          api() { curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4$1"; }
          py() { python3 -c "$1"; }
          echo "CF worker secret/var names:"
          api /accounts/$A/workers/scripts/pak-dharti-tv/secrets | py "import sys,json;d=json.load(sys.stdin);print('CF',d.get('success'),sorted(s['name'] for s in d.get('result',[])) if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          echo "CF members:"
          api /accounts/$A/members | py "import sys,json;d=json.load(sys.stdin);print('CF',d.get('success'),[(m.get('user',{}).get('email'),m.get('status'),[r.get('name') for r in m.get('roles',[])]) for m in d.get('result',[])] if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          echo "CF tokens:"
          api /user/tokens | py "import sys,json;d=json.load(sys.stdin);print('CF',d.get('success'),[(t.get('name'),t.get('status'),t.get('last_used_on'),t.get('expires_on')) for t in d.get('result',[])] if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          echo "CF audit logs:"
          api "/accounts/$A/audit_logs?per_page=40&direction=desc" | py "import sys,json;d=json.load(sys.stdin);print('CF',d.get('success'),[(a.get('when','')[:16],a.get('action',{}).get('type'),a.get('actor',{}).get('email'),a.get('actor',{}).get('ip'),a.get('resource',{}).get('type')) for a in d.get('result',[])] if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          echo "CF worker usage 7d:"
          curl -s -H "Authorization: Bearer $T" -H "Content-Type: application/json" https://api.cloudflare.com/client/v4/graphql --data "{\"query\":\"{viewer{accounts(filter:{accountTag:\\\"$A\\\"}){workersInvocationsAdaptive(limit:20,filter:{datetime_geq:\\\"$(date -u -d '7 days ago' +%FT%TZ)\\\",datetime_leq:\\\"$(date -u +%FT%TZ)\\\"}){sum{requests errors subrequests}dimensions{scriptName status}}}}}\"}" | py "import sys,json;d=json.load(sys.stdin);print('CF',json.dumps(d)[:900])"
