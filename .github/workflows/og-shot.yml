name: og-shot
on: { workflow_dispatch: {} }
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          SLUG=$(curl -s https://www.pakdhartitv.com/sitemap.xml | grep -o 'https://www.pakdhartitv.com/ur/news/[a-z0-9-]*' | head -1 | sed 's#.*/##')
          for t in 1 2; do curl -s -o /tmp/c.jpg -w "OGT card http %{http_code} %{content_type} %{size_download} %{time_total}s\n" "https://www.pakdhartitv.com/api/card/news?slug=$SLUG&lang=ur"; done
          head -c 300 /tmp/c.jpg | strings | head -3
          for t in 1 2; do curl -s -o /tmp/og.png -w "OGT og http %{http_code} %{size_download} %{time_total}s\n" "https://www.pakdhartitv.com/ur/news/$SLUG/opengraph-image"; done
